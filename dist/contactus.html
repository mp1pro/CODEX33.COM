        .contact-form {

        .form-row label {
            width: 120px;           /* fixed label width = alignment */
            font-weight: 600;
            color: #333;
            text-align: left;
        }

        .form-row input,
        .form-row textarea {
            flex: 1;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: 0.2s ease;
            font-size: 14px;
        }

        .form-row input:focus,
        .form-row textarea:focus {
            border-color: red;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
        }

        .form-row textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: red;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            background: #ff7d00
        }

        /* 📱 Mobile responsiveness */
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }

            .form-row label {
                width: 100%;
            }
        }
